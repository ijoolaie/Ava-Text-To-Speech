# Tiny architecture for the CPU smoke run: same tokenizer and same frozen Mimi
# codec as the real model, but a miniature flow LM that trains in minutes.
# Only the flow_lm section differs from config/fa.yaml.

weights_path: weights/model.safetensors
voices_dir: weights/voices
languages: [fa]

default_temperature: 0.3
default_eos_threshold: -2.0
capitalize_first_letter: false
append_terminal_punctuation: true

flow_lm:
  insert_bos_before_voice: false
  dtype: float32
  flow:
    depth: 2
    dim: 64
    type: drifting
  transformer:
    d_model: 64
    hidden_scale: 1
    max_period: 10000
    num_heads: 4
    num_layers: 2
    dim_feedforward: 64
  lookup_table:
    dim: 64
    n_bins: 4005
    tokenizer: tokenizers
    tokenizer_path: weights/tokenizer.json
    rank: null
  z_dim: 32

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 128
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios: [6, 5, 4]
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions: [512]
  quantizer:
    dimension: 32
    output_dimension: 128
  decoder_seanet:
    dimension: 128
    channels: 1
    n_filters: 32
    n_residual_layers: 1
    ratios: [6, 5, 4]
    kernel_size: 3
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  decoder_transformer:
    d_model: 128
    num_heads: 4
    num_layers: 12
    layer_scale: 0.01
    context: 50
    dim_feedforward: 384
    input_dimension: 128
    output_dimensions: [128]
