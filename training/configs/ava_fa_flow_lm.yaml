# Real training configuration for the Ava flow LM (Persian).
#
# This matches the architecture of the shipped checkpoint (config/fa.yaml is the
# source of truth for shapes). Training follows Kyutai's small-model recipe for
# Pocket TTS: the Mimi codec stays frozen, and the flow LM (15.6M params) is
# trained on continuous 12.5 Hz codec latents of real speech with a one-step
# "drifting" sampler head plus an EOS head.
#
# With `model.init_from: null` the flow LM trains from scratch on your data.
# Set it to "weights/model.safetensors" to fine-tune the released Persian model
# (recommended when your dataset is small: quality carries over, loss drops fast).

run_name: ava-fa-flowlm
seed: 0

data:
  cache_dir: data_cache/ava-fa        # written by training/data/prepare_data.py
  max_frames: 250                       # 20 s @ 12.5 Hz — longer clips are skipped
  max_tokens: 64                        # chunks longer than this are skipped
  min_frames: 10                        # clips shorter than this are skipped
  holdout_ratio: 0.02                   # random clips kept for evaluation

model:
  config: config/fa.yaml                # architecture + tokenizer paths
  init_from: null                       # "weights/model.safetensors" → fine-tune mode
  train_speaker_proj: true              # the voice-conditioning projection is trained
  speaker_cond: self                    # each clip conditions on its own voice

optim:
  lr: 5.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 500
  total_steps: 200000
  cosine_min_ratio: 0.002
  grad_clip: 1.0

loss:
  noise_std: 1.0                        # std of the sampled starting noise x_0
  latent_loss_weight: 1.0
  eos_loss_weight: 1.0

stats:
  ema_decay: 0.999                      # EMA on the latent mean/std buffers

ema:
  decay: 0.999
  warmup_steps: 100

train:
  batch_size: 16
  grad_accum: 1
  log_every: 50
  ckpt_every: 2000
  eval_every: 2000
  out_dir: runs/ava-fa

precision: fp32                          # "bf16" on CUDA; fp32 keeps CPU runs exact
device: auto                             # "cuda" | "cpu" | "auto"
